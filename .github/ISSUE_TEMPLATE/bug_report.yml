name: Bug report
description: Report a reproducible defect in XINTU.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve XINTU. Remove private or sensitive images before attaching files.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem and the result you expected.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open ...
        2. Click ...
        3. Observe ...
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Runtime mode
      options:
        - Local mock mode
        - Live Qwen mode
        - Unknown
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser, operating system, and Node.js version.
      placeholder: Chrome 140 / Windows 11 / Node.js 24
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs or screenshots
      description: Do not include API keys, tokens, or private photos.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I removed secrets and private images from this report.
          required: true
        - label: I searched existing issues before opening this one.
          required: true